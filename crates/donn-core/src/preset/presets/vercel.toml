[preset]
key = "vercel"
label = "Vercel AI Gateway"
description = "Multi-model gateway; requires an empty ANTHROPIC_API_KEY"
base_url = "https://ai-gateway.vercel.sh"
auth_mode = "auth_token"
key_url = "https://vercel.com/d?to=%2F%5Bteam%5D%2F%7E%2Fai%2Fapi-keys"

# 端点实测：ai-gateway.vercel.sh/v1/messages 回 Anthropic 错误信封。
# 网关 id 是 provider/model 形式（xAI 的前缀是 spacexai/）。候选取自 pi 远程模型目录的
# anthropic-messages 组，只列主力编码模型，其余自由输入。

