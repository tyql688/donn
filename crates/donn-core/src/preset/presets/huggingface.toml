[preset]
key = "huggingface"
label = "Hugging Face"
description = "Inference Providers router; type any HF model id, optionally with :provider or :cheapest/:fastest/:preferred suffix"
base_url = "https://router.huggingface.co"
auth_mode = "auth_token"
key_url = "https://huggingface.co/settings/tokens"

# 官方 Claude Code 接入文档：
#   https://huggingface.co/docs/inference-providers/integrations/claude-code
#   base_url = router.huggingface.co；官方示例同时导出 ANTHROPIC_AUTH_TOKEN 与
#   ANTHROPIC_API_KEY（同一个 HF token），故开 auth_token_also_sets_api_key。
#   id 可加 :provider 或 :cheapest/:fastest/:preferred 后缀选路由策略。
# 默认值取官方文档示例（zai-org/GLM-5.1 全槽位）；候选经 Inference
# Providers live 目录核对（huggingface.co/models?inference_provider=all）。
# max_context 取 pi 远程模型目录的 huggingface 数字；用 :provider 后缀钉到某个 provider 时窗口可能不同。
[preset.models]
sonnet = "zai-org/GLM-5.1"
opus = "zai-org/GLM-5.1"
fable = "zai-org/GLM-5.1"
haiku = "zai-org/GLM-5.1"

[[preset.model_choices]]
id = "zai-org/GLM-5.3"
