[preset]
key = "fireworks"
label = "Fireworks AI"
description = "Open-model hosting; type the model id yourself"
base_url = "https://api.fireworks.ai/inference"
auth_mode = "auth_token"
key_url = "https://app.fireworks.ai/settings/users/api-keys"

# 端点实测：api.fireworks.ai/inference/v1/messages 回 Anthropic 错误信封。
# id 带 accounts/fireworks/ 前缀。候选取自 pi 远程模型目录里走 anthropic-messages 协议的模型：优先列
# routers/*-latest 稳定别名，具体版本只列主力，其余自由输入。

[[preset.model_choices]]
id = "accounts/fireworks/routers/deepseek-pro-latest"
label = "DeepSeek Pro (latest) · 1M"
max_context = 1000000

