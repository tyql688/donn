[preset]
key = "openrouter"
label = "OpenRouter"
description = "Multi-provider router; type any openrouter model id, or pick a listed coding model"
base_url = "https://openrouter.ai/api"
auth_mode = "auth_token"
key_url = "https://openrouter.ai/settings/keys"

# 默认值用 OpenRouter 自己的 slug，全部条目与 context_length 经
# openrouter.ai/api/v1/models live 目录逐条核对。目录变动频繁，
# 这里只保留当前主力编码模型；其余模型自由输入即可。
[preset.models]
sonnet = "anthropic/claude-sonnet-5"
opus = "anthropic/claude-opus-5"
fable = "anthropic/claude-fable-5.1"
haiku = "anthropic/claude-haiku-4.5"

# ── Anthropic（openrouter.ai/anthropic）───────────────────────────
[[preset.model_choices]]
id = "anthropic/claude-fable-5.1"
label = "Claude Fable 5.1"

[[preset.model_choices]]
id = "anthropic/claude-fable-5"
label = "Claude Fable 5"

[[preset.model_choices]]
