[preset]
key = "mimo"
label = "Xiaomi MiMo"
description = "Pay-as-you-go — V2.6-Pro / Flash / UltraSpeed (V2.5 series offline 2026-10-21)"
base_url = "https://api.xiaomimimo.com/anthropic"
auth_mode = "auth_token"
key_url = "https://platform.xiaomimimo.com/#/console/api-keys"

# 官方 Claude Code 接入指南（仅推荐 mimo-v2.6-pro 与其 [1m] 形式）：
#   https://mimo.mi.com/docs/en-US/tokenplan/integration/claudecode
#   模型 mimo-v2.6-pro；长上下文加 [1m] → mimo-v2.6-pro[1m]
# 全部 id 见 mimo.mi.com/docs/en-US/quick-start/summary/model：mimo-v2.6-pro / mimo-v2.6-flash /
# mimo-v2.6-pro-ultraspeed 均 1M 上下文、128K 输出；mimo-v2.5-pro 与 mimo-v2.5 于 2026-10-21 10:00（北京）下线。
[preset.models]
sonnet = "mimo-v2.6-pro"
opus = "mimo-v2.6-pro"
fable = "mimo-v2.6-pro"
haiku = "mimo-v2.6-flash"

[[preset.model_choices]]
id = "mimo-v2.6-pro[1m]"
label = "V2.6-Pro · 1M (Claude Code form)"
