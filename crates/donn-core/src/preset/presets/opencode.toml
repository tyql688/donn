[preset]
key = "opencode"
label = "OpenCode Zen"
description = "Official opencode gateway; Claude and open models"
base_url = "https://opencode.ai/zen"
auth_mode = "auth_token"
key_url = "https://opencode.ai/auth"

# 端点实测：opencode.ai/zen/v1/messages 回 Anthropic 错误信封。
# 候选只列 pi 远程模型目录里走 anthropic-messages 协议的模型；Zen 上其余模型走 OpenAI 协议，Claude Code 接不了。

[[preset.model_choices]]
id = "claude-fable-5-1"
label = "Claude Fable 5.1"

[[preset.model_choices]]
id = "claude-opus-5"
label = "Claude Opus 5"

[[preset.model_choices]]
