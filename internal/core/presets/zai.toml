[preset]
key = "zai"
label = "Z.ai (GLM Coding Plan)"
description = "GLM Coding Plan international — GLM-5.3 / GLM-5.3-Flash, 1M context"
base_url = "https://api.z.ai/api/anthropic"
auth_mode = "auth_token"
key_url = "https://z.ai/manage-apikey/apikey-list"

# 模型来源：Coding Plan 文档 https://docs.z.ai/devpack/overview + pi 远程模型目录的 `zai`。
# 主推 GLM-5.3 / 5.3-Flash；厂商把 GLM-5.2、5.1 路由到 5.3，GLM-4.7 路由到 5.3-Flash。
# 要 1M 窗口得用 Claude Code 形式（docs.z.ai/devpack/latest-model）：id 加 [1m]，
# 窗口 1000000（Z.ai 官方数字，不是 1048576）。
[preset.models]
sonnet = "glm-5.3"
opus = "glm-5.3"
fable = "glm-5.3"
haiku = "glm-5.3-flash"

[[preset.model_choices]]
id = "glm-5.3[1m]"
label = "GLM-5.3 · 1M (Claude Code form)"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5.3"
label = "GLM-5.3 · flagship"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5.3-flash[1m]"
label = "GLM-5.3-Flash · 1M (Claude Code form)"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5.3-flash"
label = "GLM-5.3-Flash · fast"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5.3-highspeed"
label = "GLM-5.3 Highspeed"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5.2"
label = "GLM-5.2"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5.2-highspeed"
label = "GLM-5.2 Highspeed"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5-turbo"
label = "GLM-5 Turbo"
max_context = 200000

[[preset.model_choices]]
id = "glm-4.7"
label = "GLM-4.7"
max_context = 204800
