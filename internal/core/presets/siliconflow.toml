[preset]
key = "siliconflow"
label = "SiliconFlow"
description = "Multi-model host; ids use org prefix (e.g. zai-org/GLM-5.3)"
base_url = "https://api.siliconflow.cn"
auth_mode = "auth_token"
key_url = "https://cloud.siliconflow.cn/account/ak"

# 模型 id 区分 org/Name 大小写；候选包含支持工具调用的编码模型，其余模型可自由输入。
[preset.models]
sonnet = "zai-org/GLM-5.3"
opus = "zai-org/GLM-5.3"
fable = "zai-org/GLM-5.3"
haiku = "deepseek-ai/DeepSeek-V4.1-Flash"

