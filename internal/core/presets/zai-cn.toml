[preset]
key = "zai-cn"
label = "Zhipu GLM Coding Plan (CN)"
description = "GLM Coding Plan on bigmodel.cn — GLM-5.3 / GLM-5.3-Flash, 1M context"
base_url = "https://open.bigmodel.cn/api/anthropic"
auth_mode = "auth_token"
key_url = "https://open.bigmodel.cn/usercenter/proj-mgmt/apikeys"

# 与 zai 相同的 Coding Plan 模型（docs.z.ai/devpack/overview）：
#   GLM-5.3、GLM-5.3-Flash。GLM-5.2/5.1 自动路由到 5.3，
#   GLM-4.7 自动路由到 5.3-Flash。
[preset.models]
sonnet = "glm-5.3"
opus = "glm-5.3"
fable = "glm-5.3"
haiku = "glm-5.3-flash"

[[preset.model_choices]]
id = "glm-5.3[1m]"
label = "GLM-5.3 · 1M (Claude Code form)"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5.3"
label = "GLM-5.3 · flagship"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5.3-flash[1m]"
label = "GLM-5.3-Flash · 1M (Claude Code form)"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5.3-flash"
label = "GLM-5.3-Flash · fast"
max_context = 1000000

[[preset.model_choices]]
id = "glm-5.3-highspeed"
label = "GLM-5.3 Highspeed"
max_context = 1000000

[[preset.model_choices]]
id = "glm-4.6v"
label = "GLM-4.6V · vision"
max_context = 128000
