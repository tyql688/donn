[preset]
key = "kimi-plan"
label = "Kimi Code plan"
description = "Kimi For Coding subscription; default k3.1-pro 1M (Pro+). Tier: Andante=kimi-for-coding (K2.8 Preview, 1M); Plus/Moderato=k3.1-pro@262K; Pro/Allegretto+=k3.1-pro@1M + highspeed"
base_url = "https://api.kimi.ai/coding/"
auth_mode = "auth_token"
key_url = "https://www.kimi.com/code/console"

# 官方模型 id（Kimi Code 文档）：
#   https://www.kimi.com/code/docs/en/kimi-code/models
#   k3.1-pro | k3.1-pro-highspeed | k3 | k3-256k | kimi-for-coding | kimi-for-coding-highspeed
#   k3.1-pro 是现任旗舰（1M），k3 仍可用；kimi-for-coding 当前指向 K2.8 Preview。
# Plus/Moderato 档 k3.1-pro 限 262K，Pro/Allegretto+ 才到 1M；HighSpeed 约 2-3 倍速。
# Claude Code 1M 用 k3.1-pro[1m]（仅限 Claude Code env），不是裸 k3.1-pro：
#   https://www.kimi.com/code/docs/en/third-party-tools/claude-code.html
[preset.models]
sonnet = "k3.1-pro[1m]"
opus = "k3.1-pro[1m]"
fable = "k3.1-pro[1m]"
haiku = "k3.1-pro[1m]"

[preset.env]
CLAUDE_CODE_EFFORT_LEVEL = "max"

# ── Kimi Code 官方阵容 ─────────────────────────────────────────────
[[preset.model_choices]]
id = "k3.1-pro[1m]"
label = "K3.1 Pro · 1M (Pro+; Claude Code form)"
max_context = 1048576

[[preset.model_choices]]
id = "k3.1-pro"
label = "K3.1 Pro · API id (Plus/Moderato 256K)"
max_context = 262144

[[preset.model_choices]]
id = "k3.1-pro-highspeed"
label = "K3.1 Pro HighSpeed · 1M (Pro+)"
max_context = 1048576

[[preset.model_choices]]
id = "k3[1m]"
label = "K3 · 1M (Claude Code form)"
max_context = 1048576

[[preset.model_choices]]
id = "k3"
label = "K3 · API id (Moderato 256K)"
max_context = 262144

[[preset.model_choices]]
id = "k3-256k"
label = "K3-256k · 256K (lower quota than k3 1M)"
max_context = 262144

[[preset.model_choices]]
id = "kimi-for-coding"
label = "K2.8 Preview · 1M (all tiers)"
max_context = 1048576

[[preset.model_choices]]
id = "kimi-for-coding-highspeed"
label = "K2.7 Code HighSpeed · 256K (Allegretto+)"
max_context = 262144
